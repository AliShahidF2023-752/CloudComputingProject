name: AI Text Detector CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'model/**'
  pull_request:
    branches:
      - main
    paths:
      - 'model/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: model/requirements.txt

      - name: Install linting tools
        run: |
          pip install flake8 pylint

      - name: Run flake8
        working-directory: model
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint
        working-directory: model
        run: find . -name '*.py' -exec pylint --errors-only --disable=import-error {} +

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./model
          file: ./model/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-text-detector:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-text-detector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
