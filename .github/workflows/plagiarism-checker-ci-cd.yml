name: Plagiarism Checker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'plagiarism-checker/**'
  pull_request:
    branches:
      - main
    paths:
      - 'plagiarism-checker/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: plagiarism-checker/requirements.txt

      - name: Install linting tools
        run: |
          pip install flake8 pylint

      - name: Run flake8
        working-directory: plagiarism-checker
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint
        working-directory: plagiarism-checker
        run: find . -name '*.py' -exec pylint --errors-only --disable=import-error {} +

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./plagiarism-checker
          file: ./plagiarism-checker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plagiarism-checker:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/plagiarism-checker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
